name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set the version from the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          jq --arg v "$version" '.version = $v' custom_components/room_companion/manifest.json > manifest.tmp
          mv manifest.tmp custom_components/room_companion/manifest.json
      - name: Zip the integration
        run: cd custom_components/room_companion && zip -r "$GITHUB_WORKSPACE/room_companion.zip" . -x '__pycache__/*'
      - uses: softprops/action-gh-release@v2
        with:
          files: room_companion.zip
